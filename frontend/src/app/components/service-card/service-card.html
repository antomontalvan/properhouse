<div class="service-card">
	<img [src]="imageUrl" [alt]="title">

	<div class="overlay"></div>

	<div class="service-content">
		<h3>{{ title }}</h3>

		<p class="price">{{ price }}</p>

		<p class="description">
			{{ description }}
		</p>

		<button>
			Reservar este servicio
			<span>→</span>
		</button>
	</div>
</div>
